name: Deploy to AWS LAMP Server

on:
    push:
        branches: ["main"]
    
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Copy files to EC2 via SSH
            uses: appleboy/scp-action@master
            with:
              host: ${{ secrets.EC2_HOST }}
              username: "ubuntu"
              key: ${{ secrets.EC2_SSH_KEY }}
              source: "."
              target: "/var/www/html"

            